ktor {
    deployment {
        // HTTPS only. The keystore is a self-signed dev certificate generated by
        // `./gradlew generateDevKeystore` (run automatically by `./gradlew run`).
        sslPort = 8443
        sslPort = ${?SSL_PORT}
    }
    security {
        ssl {
            keyStore = "keystore.p12"
            keyStore = ${?KEYSTORE_PATH}
            keyAlias = "counters"
            keyAlias = ${?KEYSTORE_ALIAS}
            keyStorePassword = "changeit"
            keyStorePassword = ${?KEYSTORE_PASSWORD}
            privateKeyPassword = "changeit"
            privateKeyPassword = ${?KEYSTORE_KEY_PASSWORD}
        }
    }
    application {
        modules = [ com.counters.ApplicationKt.module ]
    }
}

database {
    // "counters" is a Postgres schema inside the default "postgres" database. It is created
    // on startup if missing; currentSchema sets the connection's search_path so unqualified
    // table names (Exposed, Liquibase) resolve against it.
    jdbcUrl = "jdbc:postgresql://localhost:5432/postgres?currentSchema=counters"
    jdbcUrl = ${?DATABASE_URL}
    schema = "counters"
    schema = ${?DATABASE_SCHEMA}
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "root"
    password = ${?DATABASE_PASSWORD}
    driver = "org.postgresql.Driver"
    maximumPoolSize = 10
}
